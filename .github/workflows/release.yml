# Releases Grafeno Studio and Grafeno Desktop when a tag like
# desktop-v0.2.0 is pushed: the desktop installers for Windows (.exe, .msi)
# and Linux (.deb, .rpm, .AppImage), the Studio's web build (.zip), each
# with a .sha256 (and a .minisig when the minisign key is set). None
# carries an engine: the engine is released from its own repository.
#
# Secrets, each optional:
#   MINISIGN_SECRET_KEY        a minisign secret key (minisign -G -W)
#   WINDOWS_CERTIFICATE        a base64 .pfx code-signing certificate, and
#   WINDOWS_CERTIFICATE_PASSWORD  its password: they sign the app and its installers
name: release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: One version everywhere, and its notes
        run: |
          cargo="$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/Cargo.toml | head -1)"
          tauri="$(node -p "require('./desktop/tauri.conf.json').version")"
          studio="$(node -p "require('./studio/package.json').version")"
          echo "Cargo $cargo, tauri.conf $tauri, Studio $studio"
          test "$cargo" = "$tauri" && test "$cargo" = "$studio"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            test "$GITHUB_REF_NAME" = "desktop-v$cargo" || { echo "tag $GITHUB_REF_NAME, version $cargo"; exit 1; }
          fi
          grep -q "^## $cargo" CHANGELOG.md || { echo "CHANGELOG.md has no section for $cargo"; exit 1; }
          echo "version=$cargo" >> "$GITHUB_OUTPUT"

  studio:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test and build the Studio
        run: |
          npm ci --prefix studio --no-audit --no-fund
          npm test --prefix studio
          npm run build --prefix studio
          mkdir -p out
          (cd studio/dist && zip -qr "../../out/grafeno-studio-web-${{ needs.check.outputs.version }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: studio
          path: out/*

  linux:
    needs: check
    # The oldest supported runner: the packages then need only its glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev rpm
      - name: Build the .deb, .rpm and .AppImage
        run: |
          npm ci --prefix studio --no-audit --no-fund
          npm ci --prefix desktop --no-audit --no-fund
          cd desktop && npx tauri build --bundles deb,rpm,appimage
      - name: Collect them
        run: |
          mkdir -p out
          cp desktop/target/release/bundle/deb/*.deb desktop/target/release/bundle/rpm/*.rpm \
             desktop/target/release/bundle/appimage/*.AppImage out/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  windows:
    needs: check
    runs-on: windows-latest
    env:
      CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the .exe and .msi
        shell: pwsh
        run: |
          npm ci --prefix studio --no-audit --no-fund
          npm ci --prefix desktop --no-audit --no-fund
          Set-Location desktop
          if ($env:CERTIFICATE) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERTIFICATE))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            $command = "`"$($signtool.FullName)`" sign /f `"$env:RUNNER_TEMP\cert.pfx`" /p `"$env:CERTIFICATE_PASSWORD`" /fd sha256 /tr http://timestamp.digicert.com /td sha256 %1"
            $config = @{ bundle = @{ windows = @{ signCommand = $command } } } | ConvertTo-Json -Depth 5 -Compress
            npx tauri build --bundles nsis,msi --config $config
          } else {
            npx tauri build --bundles nsis,msi
          }
          New-Item -ItemType Directory -Force ..\out | Out-Null
          Copy-Item target\release\bundle\nsis\*.exe, target\release\bundle\msi\*.msi ..\out\
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  publish:
    needs: [check, studio, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        run: cd files && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - name: Sign the files (minisign)
        if: env.MINISIGN_SECRET_KEY != ''
        run: |
          sudo apt-get install -y -qq minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          for f in files/*; do
            case "$f" in *.sha256) continue ;; esac
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$f"
          done
          rm "$RUNNER_TEMP/minisign.key"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.check.outputs.version }}"
          awk -v v="$version" '$0 ~ "^## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" \
            --title "Grafeno Studio and Desktop $version" --notes-file notes.md
