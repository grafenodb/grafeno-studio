[package]
name = "grafeno-desktop"
description = "Grafeno Desktop: Grafeno Studio in native windows, speaking to installed engines and servers through their HTTP API"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Unspecified"
default-run = "grafeno-desktop"

[[bin]]
name = "grafeno-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# No engine crate: local files are served by the installed `grafeno`.
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
ureq = "3"
